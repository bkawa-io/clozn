<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clozn Casting Optics Demo</title>
<style>
:root{
  --iri-peri:#96AFF2;--iri-mint:#6ECDBE;--iri-pink:#E896D6;--iri-lilac:#BAB2E2;--iri-gold:#F0D096;
  --ink:#E8E9F8;--ink-faint:#8C92BB;--line-strong:#3B4070;--evidence:#5FC8B4;
  --voice-machine:ui-monospace,"Cascadia Mono",monospace;
  --glow-evidence:0 0 18px rgba(95,200,180,.45);
}
html,body{height:100%;margin:0;background:#0b0d1e}
.demo{position:relative;width:min(1200px,94vw);height:min(720px,86vh);margin:6vh auto;border:1px solid #30365f;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 48%,#1d2048,#0b0d1e 72%)}
.real-cast-placeholder{position:absolute;z-index:2;inset:16% 22%;display:grid;place-items:center;color:#dcdcf7;font:12px ui-monospace;letter-spacing:.16em;text-transform:uppercase;border:1px solid rgba(255,255,255,.09);border-radius:50%;box-shadow:0 0 80px rgba(182,176,250,.16)}
</style>
<link rel="stylesheet" href="./casting-optics.css">
</head>
<body>
<div class="demo" id="hero"><div class="real-cast-placeholder">existing measured casting remains here</div></div>
<script type="module">
import { mountCastingOptics } from "./casting-optics.mjs";
mountCastingOptics(document.querySelector("#hero"), {activity:.72});
</script>
</body>
</html>
