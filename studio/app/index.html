<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>clozn</title>
<link rel="stylesheet" href="./tokens.css">
<style>
  /* shell layout only — all look comes from tokens.css */
  .shell{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:18px 20px 40px}
  #ambient{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:.5}
  header.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .brand{font-family:var(--voice-display);font-size:15px;letter-spacing:.3em;font-weight:600}
  .serving{display:inline-flex;gap:8px;align-items:center;font-family:var(--voice-machine);
    font-size:var(--text-small);color:var(--ink-soft);border:1px solid var(--line);
    border-radius:var(--r-pill);padding:5px 13px}
  .serving .dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);flex:none}
  .serving .dot.up{background:var(--evidence)}
  .bar .spacer{flex:1}
  .theme-toggle{font-family:var(--voice-machine);font-size:var(--text-label);letter-spacing:var(--track-label);
    color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px}
  .theme-toggle:hover{color:var(--ink);border-color:var(--line-strong)}
  nav.primary{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap}
  nav.primary a{font-family:var(--voice-machine);font-size:var(--text-small);letter-spacing:.05em;
    color:var(--ink-soft);text-decoration:none;padding:7px 16px;border-radius:var(--r-pill);
    border:1px solid transparent}
  nav.primary a:hover{color:var(--ink);border-color:var(--line)}
  nav.primary a[aria-current="page"]{color:var(--ink);border-color:var(--line-strong)}
  main#view{min-height:50vh}
  .view-title{margin:0 0 4px;font-size:var(--text-title);font-weight:600}
  .view-sub{font-family:var(--voice-machine);font-size:var(--text-label);letter-spacing:var(--track-label);
    color:var(--ink-faint);margin-bottom:16px}
  .run-list{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
  .run-list a{display:block;padding:12px 16px;text-decoration:none;color:var(--ink)}
  .run-list li{transition:border-color var(--swift)}
  .run-list li:hover{border-color:var(--line-strong)}
  .run-prompt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .run-meta{font-family:var(--voice-machine);font-size:var(--text-label);color:var(--ink-faint);
    margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
  .quiet{color:var(--ink-soft);font-style:italic;padding:26px 0}
  .kv{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--voice-machine);font-size:var(--text-small);
    color:var(--ink-soft)}
  .kv b{color:var(--ink);font-weight:600}

  /* ================= Lens page (build 2) ================= */
  .lens-page{display:flex;flex-direction:column;gap:14px}
  .back-link{align-self:flex-start;font-size:var(--text-label);color:var(--ink-faint);text-decoration:none}
  .back-link:hover{color:var(--ink)}

  .identity-strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:var(--voice-machine);font-size:var(--text-label);color:var(--ink-soft);
    border-bottom:1px solid var(--line);padding-bottom:12px}
  .id-item{display:inline-flex;gap:6px;align-items:baseline;white-space:nowrap}
  .id-k{color:var(--ink-faint);letter-spacing:var(--track-label);text-transform:uppercase}
  .identity-strip .machine{color:var(--ink)}
  .id-item.repro{color:var(--evidence)}
  .identity-strip .spacer{flex:1}
  .permalink{font-family:var(--voice-machine);font-size:var(--text-label);color:var(--ink-faint);
    border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 12px;max-width:280px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .permalink:hover{color:var(--ink);border-color:var(--line-strong)}

  .lens-picker{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lens-tab{font-family:var(--voice-machine);font-size:var(--text-small);letter-spacing:.04em;
    padding:8px 18px;border-radius:var(--r-pill);border:1px solid var(--line);color:var(--ink-soft);
    transition:border-color var(--swift),color var(--swift),background var(--swift)}
  .lens-tab:hover{border-color:var(--line-strong);color:var(--ink)}
  .lens-tab[aria-selected="true"]{color:var(--ink);border-color:var(--fork);
    background:color-mix(in srgb,var(--fork) 12%,transparent)}
  .lens-busy{margin-left:4px;font-size:var(--text-label)}

  .lens-panes{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
  @media (max-width:800px){.lens-panes{grid-template-columns:1fr}}
  .lens-panes .pane{display:flex;flex-direction:column;min-height:220px}
  .pane-head{display:flex;align-items:center;gap:10px;padding:11px 16px;
    border-bottom:1px solid var(--pearl-edge)}
  .pane-head .label{flex:1;font-family:var(--voice-machine);font-size:var(--text-label);
    letter-spacing:var(--track-label);text-transform:uppercase;color:var(--ink-faint)}
  .pane-body{padding:16px 18px;overflow-y:auto;overflow-x:hidden;max-height:560px;line-height:1.65}
  .reply-pane .pane-body p{margin:0 0 1em}
  .reply-pane .pane-body p:last-child{margin-bottom:0}

  .ctx-source{margin-bottom:18px}
  .ctx-source:last-child{margin-bottom:0}
  .ctx-source-role{margin-bottom:6px}
  .ctx-source-text{white-space:pre-wrap;word-break:break-word}
  .ctx-omitted .ctx-source-text{opacity:.65}
  .ctx-omitted-tag{color:var(--ink-faint);font-weight:400;text-transform:none;letter-spacing:0}

  .copy-btn{font-family:var(--voice-machine);font-size:var(--text-label);color:var(--ink-faint);
    border:1px solid var(--line);border-radius:var(--r-pill);padding:4px 11px}
  .copy-btn:hover{color:var(--ink);border-color:var(--line-strong)}

  .code-block-wrap{position:relative;margin:0 0 1em}
  .code-block-wrap:last-child{margin-bottom:0}
  .code-block{margin:0;padding:14px 74px 14px 16px;border:1px solid var(--line);
    border-radius:var(--r-instrument);background:var(--ground-1);overflow-x:auto;
    font-size:var(--text-small);line-height:1.55}
  .code-copy{position:absolute;top:8px;right:8px}

  mark{background:none;color:inherit;font:inherit;transition:box-shadow var(--swift)}
  [data-lens="sources"] mark.src-mark{
    background:color-mix(in srgb,var(--evidence) calc(var(--mark-a,0)*28%),transparent);
    border-bottom:2px solid color-mix(in srgb,var(--evidence) calc(25% + var(--mark-a,0)*75%),transparent);
    border-radius:2px;padding:0 1px;cursor:default}
  [data-lens="sources"] mark.src-mark.src-suppress{
    background:color-mix(in srgb,var(--shaky) calc(var(--mark-a,0)*26%),transparent);
    border-bottom-color:color-mix(in srgb,var(--shaky) calc(25% + var(--mark-a,0)*75%),transparent)}
  [data-lens="sources"] .reply-pane mark.ans-mark{
    background:color-mix(in srgb,var(--evidence) 18%,transparent);border-radius:2px;
    padding:0 1px;cursor:default}
  [data-lens="sources"] mark.xlink{box-shadow:0 0 0 2px var(--evidence) inset}
  [data-lens="sources"] mark.xlink-self{box-shadow:0 0 0 2px var(--fork) inset}

  .honesty-drawer{padding:14px 18px;display:flex;flex-direction:column;gap:7px}
  .drawer-row{display:flex;gap:14px;font-size:var(--text-small)}
  .drawer-row .label{flex:0 0 110px;font-family:var(--voice-machine);font-size:var(--text-label);
    color:var(--ink-faint);letter-spacing:var(--track-label);text-transform:uppercase;padding-top:2px}
  .drawer-val{color:var(--ink-soft);flex:1}
  .drawer-arriving{padding:2px 0 0;margin:0;font-size:var(--text-label)}

  .quiet-strip{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px 14px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-size:var(--text-label);color:var(--ink-soft);
    border:1px solid var(--line);border-radius:var(--r-pill);padding:5px 12px 5px 9px}
  .chip i{width:6px;height:6px;border-radius:50%;flex:none;background:var(--ink-faint)}
  .chip-confident i{background:var(--confidence)}
  .chip-shaky i{background:var(--shaky)}
  .chip-evidence i{background:var(--evidence)}

  /* ================= shared: buttons, inputs, tags, skeletons (build 3) ================= */
  .btn-ghost{font-family:var(--voice-machine);font-size:var(--text-label);letter-spacing:.03em;
    color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 14px;
    transition:border-color var(--swift),color var(--swift)}
  .btn-ghost:hover{color:var(--ink);border-color:var(--line-strong)}
  .btn-ghost.small{padding:4px 11px}
  .btn-ghost.primary{color:var(--ink);border-color:var(--fork)}
  .btn-ghost.primary:hover{background:color-mix(in srgb,var(--fork) 10%,transparent)}
  .btn-ghost:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost.btn-armed{color:var(--surface);background:var(--shaky);border-color:var(--shaky)}

  .text-input{font-family:var(--voice-machine);font-size:var(--text-small);color:var(--ink);
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-instrument);
    padding:6px 10px}
  .text-input:focus-visible{border-color:var(--fork)}
  .text-input.narrow{width:5.5em}

  .dial-tag{font-family:var(--voice-machine);font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-faint);border:1px solid var(--line);border-radius:var(--r-pill);padding:1px 8px}
  .dial-tag-custom{color:var(--fork);border-color:color-mix(in srgb,var(--fork) 55%,var(--line))}
  .dial-tag-calib{color:var(--evidence);border-color:color-mix(in srgb,var(--evidence) 55%,var(--line))}

  .skeleton-block{border:1px dashed var(--line-strong);border-radius:var(--r-instrument);
    padding:14px 16px;display:flex;flex-direction:column;gap:7px}

  .small-note{font-size:var(--text-label);margin:8px 0 0}
  .ab-preview{display:flex;flex-direction:column;gap:4px;font-size:var(--text-small);padding:6px 0}
  .ab-preview .label{margin-right:8px}

  /* ================= Behavior + Model shared page rhythm (build 3) ================= */
  .behavior-page,.model-page{display:flex;flex-direction:column;gap:6px}
  .bhv-section,.mdl-section{margin:22px 0 6px;padding-top:18px;border-top:1px solid var(--line)}
  .bhv-section:first-of-type,.mdl-section:first-of-type{border-top:none;padding-top:0;margin-top:8px}
  .bhv-h{margin:0 0 6px;font-size:var(--text-title);font-weight:600}
  .bhv-h3{margin:20px 0 8px;font-size:var(--text-body);font-weight:600;color:var(--ink-soft)}
  .bhv-sub{margin:0 0 14px;max-width:62ch}
  .bhv-caveat{margin:28px 0 10px;padding-top:14px;border-top:1px solid var(--line);max-width:62ch}

  /* -- dials: a plain list of rows, not cards -- */
  .dial-list{display:flex;flex-direction:column}
  .dial-row{padding:10px 0;border-bottom:1px solid var(--line)}
  .dial-row:last-child{border-bottom:none}
  .dial-head{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
  .dial-label{display:inline-flex;gap:7px;align-items:baseline;cursor:default}
  .pole-neg,.pole-pos{font-size:var(--text-label);color:var(--ink-faint)}
  .dial-name{font-size:var(--text-small);color:var(--ink);text-transform:uppercase;letter-spacing:.04em}
  .dial-val{margin-left:auto;color:var(--ink-soft);font-size:var(--text-small)}
  .dial-slider{width:100%;accent-color:var(--fork);height:20px}
  .dial-actions{display:flex;gap:8px;margin-top:6px}
  .dial-preview{margin-top:6px}

  /* -- concept steering: chip row + inline add form -- */
  .concept-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;min-height:26px}
  .chip-concept{padding-right:6px}
  .chip-val{color:var(--ink-faint)}
  .chip-x{color:var(--ink-faint);line-height:1;padding:0 2px;border-radius:3px}
  .chip-x:hover{color:var(--shaky)}
  .concept-add{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .concept-preview{margin-top:8px}

  /* -- anchored memory: the centerpiece. Glass panes -- you're looking at a real fitted decomposition. -- */
  .anchor-fit-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  #fitCard{max-width:340px}
  #fitResult{margin-bottom:16px}
  .anchor-list{display:flex;flex-direction:column;gap:16px;margin-top:14px}
  .anchor-bag .pane-head{gap:12px}
  .anchor-bag .pane-head .label{flex:none}
  .anchor-card-text{flex:1;font-style:italic;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;min-width:0}
  .anchor-toggle{display:inline-flex;align-items:center;gap:6px;font-size:var(--text-label);
    color:var(--ink-soft);cursor:pointer}
  .anchor-toggle input{accent-color:var(--evidence)}
  .alpha-table{width:100%;border-collapse:collapse}
  .alpha-table td{padding:3px 8px 3px 0;font-size:var(--text-small);border-bottom:1px solid var(--line)}
  .alpha-table tr:last-child td{border-bottom:none}
  .alpha-val{width:5em;text-align:right;color:var(--ink-soft)}
  .alpha-word{color:var(--ink)}
  .term-x{width:100%;color:var(--ink-faint);text-align:right;padding:0 4px}
  .term-x:hover{color:var(--shaky)}
  .anchor-meta{margin-top:8px;font-size:10px}
  .refused-note{font-style:italic}
  .whatlearned-block{margin:10px 0 18px;padding:12px 16px;border:1px solid var(--line);
    border-radius:var(--r-instrument)}
  .whatlearned-table{white-space:pre-wrap;font-size:var(--text-small);margin:8px 0;color:var(--ink-soft)}

  /* -- settings -- */
  .settings-row{margin-bottom:10px}
  .switch-label{display:inline-flex;gap:8px;align-items:center;font-size:var(--text-small)}
  .switch-label input{accent-color:var(--fork)}
  .settings-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;
    margin-bottom:12px;max-width:560px}
  .settings-field{display:flex;flex-direction:column;gap:4px}

  /* -- profiles: a list, distinct rhythm from the dial list (multi-line rows, actions at the end) -- */
  .profile-list{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:2px}
  .profile-row{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:10px;
    padding:10px 0;border-bottom:1px solid var(--line)}
  .profile-row:last-child{border-bottom:none}
  .profile-active{background:color-mix(in srgb,var(--fork) 5%,transparent)}
  .profile-desc{grid-column:1 / -1;order:3}
  .profile-meta{grid-column:1 / -1;order:4;font-size:10px}
  .profile-actions{display:flex;gap:8px;justify-self:end}
  .profile-save-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ================= Model page ================= */
  .serving-kv{padding:14px 18px;gap:22px}
  .cap-list{display:flex;flex-direction:column}
  .cap-row{display:grid;grid-template-columns:14px 110px 90px 1fr;align-items:baseline;gap:10px;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .cap-row:last-child{border-bottom:none}
  .cap-row.cap-absent{opacity:.68}
  .cap-dot{width:7px;height:7px;border-radius:50%;background:var(--line-strong);align-self:center}
  .cap-dot-on{background:var(--evidence)}
  .cap-label{font-size:var(--text-small);text-transform:uppercase;letter-spacing:.03em}
  .cap-state{font-size:var(--text-label);color:var(--ink-faint)}
  .cap-reason{font-size:var(--text-small);color:var(--ink-soft)}
  .cap-flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  @media (max-width:700px){.cap-row{grid-template-columns:14px 1fr;row-gap:2px}
    .cap-state,.cap-reason{grid-column:2}}
</style>
</head>
<body>
<canvas id="ambient" aria-hidden="true"></canvas>
<div class="shell">
  <header class="bar">
    <span class="brand">CLOZN</span>
    <span class="serving" id="serving"><span class="dot"></span><span>reaching the runtime…</span></span>
    <span class="spacer"></span>
    <button class="theme-toggle" id="theme">◐ NIGHT</button>
  </header>
  <nav class="primary" id="nav">
    <a href="#/runs">runs</a>
    <a href="#/model">model</a>
    <a href="#/behavior">behavior</a>
  </nav>
  <main id="view" aria-live="polite"></main>
</div>
<script type="module" src="./app.mjs"></script>
</body>
</html>
