name: Real runtime smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

concurrency:
  group: real-runtime-smoke-${{ github.ref }}
  cancel-in-progress: false

env:
  MODEL_REVISION: df5bf01389a39c743ab467d734bf501681e041c5
  MODEL_FILE: qwen2.5-0.5b-instruct-q4_k_m.gguf
  MODEL_SHA256: 74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db

jobs:
  linux-cpu:
    name: pinned worker + real GGUF (Linux CPU)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The `runner` context is only in scope inside jobs.<job_id>.steps.* (run/env/with/if/...),
      # NOT in a job-level `env:` block -- GitHub's Actions schema validator rejects a workflow that
      # references it there at PARSE time, before any job is created, which is exactly the "failed
      # run with zero jobs" signature this step exists to fix. Route MODEL_PATH through $GITHUB_ENV
      # instead so every later step in this job still sees it as a plain env var.
      - name: Resolve the model cache path
        run: |
          echo "MODEL_PATH=${{ runner.temp }}/clozn-models/${{ env.MODEL_FILE }}" >> "$GITHUB_ENV"
          echo "CLOZN_DATA_ROOT=${{ runner.temp }}/clozn-v1-data" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the test runner only
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Install CPU build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ curl

      - name: Cache the pinned acceptance model
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clozn-models
          key: qwen2.5-0.5b-instruct-q4-k-m-${{ env.MODEL_SHA256 }}

      - name: Download and verify the acceptance model
        run: |
          mkdir -p "$(dirname "$MODEL_PATH")"
          if [[ ! -f "$MODEL_PATH" ]]; then
            curl --fail --location --retry 3 \
              --output "$MODEL_PATH" \
              "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/${MODEL_REVISION}/${MODEL_FILE}?download=true"
          fi
          echo "${MODEL_SHA256}  ${MODEL_PATH}" | sha256sum --check

      - name: Reconstruct the pinned llama.cpp source
        run: python engine/core/third_party/bootstrap_llama.py

      - name: Build the real CPU worker
        run: |
          cmake -S engine/core -B engine/core/build-serve -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCLOZN_BUILD_GGML=ON \
            -DCLOZN_BUILD_SERVE=ON \
            -DGGML_CUDA=OFF
          cmake --build engine/core/build-serve --target clozn-server -j 2

      - name: Run the P0 model-free contracts
        run: >-
          python -m pytest -q
          tests/test_runtime_architecture.py
          tests/test_v1_acceptance_smoke.py
          tests/test_v1_product_boundary.py

      - name: Start the v1 gateway and wait for readiness
        run: |
          mkdir -p smoke-logs
          python -m clozn serve "$MODEL_PATH" --cpu --port 8080 \
            > smoke-logs/gateway.log 2>&1 &
          supervisor_pid=$!
          echo "CLOZN_SUPERVISOR_PID=$supervisor_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              cat smoke-logs/gateway.log
              exit 1
            fi
            sleep 1
          done
          cat smoke-logs/gateway.log
          exit 1

      - name: Run the live two-feature acceptance journey
        run: |
          set -o pipefail
          python scripts/smoke/v1_acceptance.py \
            --base-url http://127.0.0.1:8080 \
            --timeout 300 \
            --job-timeout 300 | tee smoke-logs/acceptance.json

      - name: Restart and reopen durable results
        run: |
          kill -TERM "$CLOZN_SUPERVISOR_PID"
          for attempt in $(seq 1 30); do
            kill -0 "$CLOZN_SUPERVISOR_PID" 2>/dev/null || break
            sleep 1
          done
          python -m clozn serve "$MODEL_PATH" --cpu --port 8080 \
            > smoke-logs/gateway-restart.log 2>&1 &
          supervisor_pid=$!
          echo "CLOZN_SUPERVISOR_PID=$supervisor_pid" >> "$GITHUB_ENV"
          for attempt in $(seq 1 240); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              break
            fi
            if ! kill -0 "$supervisor_pid" 2>/dev/null; then
              cat smoke-logs/gateway-restart.log
              exit 1
            fi
            sleep 1
          done
          python - <<'PY'
          import json
          from urllib.request import urlopen

          with open("smoke-logs/acceptance.json", encoding="utf-8") as handle:
              report = json.load(handle)
          parent = report["parent_run_id"]
          minimal = report["minimal_context"]
          result_id = minimal["result_id"]
          child = minimal["child_run_id"]
          paths = (
              f"/runs/{parent}",
              f"/runs/{parent}/minimal-context/results/{result_id}",
              f"/runs/{child}",
          )
          for path in paths:
              with urlopen("http://127.0.0.1:8080" + path, timeout=30) as response:
                  assert response.status == 200, (path, response.status)
                  json.load(response)
          print("restart persistence: parent, result, and child reopened")
          PY

      - name: Verify process cleanup
        if: always()
        run: |
          mkdir -p smoke-logs
          python -m clozn stop all || true
          python -m clozn ps | tee smoke-logs/clozn-ps.txt
          if pgrep -af 'clozn-server|clozn\.server\.app|python.*-m clozn serve' \
              > smoke-logs/residual-processes.txt; then
            cat smoke-logs/residual-processes.txt
            pkill -TERM -f 'clozn-server|clozn\.server\.app|python.*-m clozn serve' || true
            exit 1
          fi
          echo "No Clozn process remains." | tee smoke-logs/residual-processes.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: real-runtime-smoke-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            smoke-logs
            ~/.clozn/worker.log
            ~/.clozn/gateway.log
